<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация в библиотеке</title>
    <link href="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/css/uikit.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffba0a 0%, #ffd966 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {
            max-width: 400px;
            width: 100%;
            margin: 20px;
        }

        .register-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2rem;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header h1 {
            color: #ffba0a;
            margin-bottom: 0.5rem;
        }

        .btn-register {
            background: #7fff00;
            color: #000;
            width: 100%;
            padding: 10px;
            font-weight: bold;
            border: none;
        }

        .btn-register:hover {
            background: #6ee600;
            color: #000;
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
        }

        .uk-input:focus {
            border-color: #ffba0a;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>Регистрация</h1>
                <p>Создайте новую учетную запись</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="uk-alert uk-alert-{{ message.tags }}" uk-alert>
                        <a href="#" class="uk-alert-close" uk-close></a>
                        <p>{{ message }}</p>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="uk-margin">
                    <div class="uk-inline uk-width-1-1">
                        <span class="uk-form-icon" uk-icon="icon: user"></span>
                        <input class="uk-input" type="text" name="username" placeholder="Логин" required>
                    </div>
                </div>
                <div class="uk-margin">
                    <div class="uk-inline uk-width-1-1">
                        <span class="uk-form-icon" uk-icon="icon: mail"></span>
                        <input class="uk-input" type="email" name="email" placeholder="Email (необязательно)">
                    </div>
                </div>
                <div class="uk-margin">
                    <div class="uk-inline uk-width-1-1">
                        <span class="uk-form-icon" uk-icon="icon: lock"></span>
                        <input class="uk-input" type="password" name="password" placeholder="Пароль" required>
                    </div>
                </div>
                <div class="uk-margin">
                    <div class="uk-inline uk-width-1-1">
                        <span class="uk-form-icon" uk-icon="icon: lock"></span>
                        <input class="uk-input" type="password" name="password2" placeholder="Подтверждение пароля" required>
                    </div>
                </div>
                <div class="uk-margin">
                    <button class="uk-button btn-register" type="submit">Зарегистрироваться</button>
                </div>
            </form>

            <div class="login-link">
                <p>Уже есть аккаунт? <a href="{% url 'login' %}" style="color: #ffba0a;">Войти</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/js/uikit-icons.min.js"></script>
</body>
</html>
