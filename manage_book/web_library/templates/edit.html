<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование книги</title>
    <link href="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/css/uikit.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #ffba0a 0%, #ffd966 100%);
            min-height: 100vh;
            padding: 40px 0;
        }

        .book-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
        }

        h1 {
            color: #ffba0a;
            text-align: center;
            margin-bottom: 2rem;
        }

        .btn-update {
            background: #7fff00;
            color: #000;
        }

        .btn-update:hover {
            background: #6ee600;
            color: #000;
        }

        .btn-cancel {
            background: #ed7155;
            color: #fff;
        }

        .btn-cancel:hover {
            background: #e55a3a;
            color: #fff;
        }

        .uk-input:focus, .uk-select:focus {
            border-color: #ffba0a;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-label input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="uk-container">
        <div class="book-card">
            <h1>Редактирование книги</h1>
            <form method="post" class="uk-form-stacked">
                {% csrf_token %}
                <div class="uk-margin">
                    <label class="uk-form-label">Название книги *</label>
                    <input class="uk-input" type="text" name="title" value="{{ book.title }}" required>
                </div>
                <div class="uk-margin">
                    <label class="uk-form-label">Автор *</label>
                    <input class="uk-input" type="text" name="author" value="{{ book.author }}" required>
                </div>
                <div class="uk-margin">
                    <label class="uk-form-label">Жанр *</label>
                    <select class="uk-select" name="genre" required>
                        {% for genre in genres %}
                            <option value="{{ genre.id }}" {% if book.genre.id == genre.id %}selected{% endif %}>
                                {{ genre.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="uk-margin">
                    <label class="uk-form-label">ISBN</label>
                    <input class="uk-input" type="text" name="isbn" value="{{ book.isbn }}">
                </div>
                <div class="uk-margin">
                    <label class="checkbox-label">
                        <input type="checkbox" name="available" {% if book.available %}checked{% endif %}>
                        <span>Книга доступна для выдачи</span>
                    </label>
                </div>
                <div class="uk-margin uk-flex uk-flex-between">
                    <button class="uk-button btn-update" type="submit">Обновить</button>
                    <a href="/" class="uk-button btn-cancel">Отмена</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/js/uikit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/uikit@3.6.22/dist/js/uikit-icons.min.js"></script>
</body>
</html>
